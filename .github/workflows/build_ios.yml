name: Build iOS IPA (Unsigned for Sideloadly)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚙️ Désactiver Swift Package Manager (Force CocoaPods pour Firebase)
        run: |
          flutter config --no-enable-swift-package-manager

      - name: 📦 Récupérer les dépendances Flutter
        run: flutter pub get

      - name: 🍎 Installer CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🔨 Compiler l'application iOS (Sans signature)
        run: flutter build ios --release --no-codesign

      - name: 📦 Créer le fichier .IPA pour Sideloadly
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r QuizBot_unsigned.ipa Payload/
          cd ../../..

      - name: 🚀 Télécharger le fichier IPA (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: QuizBot-iOS-IPA
          path: build/ios/iphoneos/QuizBot_unsigned.ipa
          retention-days: 7
